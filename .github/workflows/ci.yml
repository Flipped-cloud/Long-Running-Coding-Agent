name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Verify user namespaces
        id: userns
        shell: bash
        run: |
          if unshare -Ur true; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "User namespaces are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::User namespaces are unavailable; native sandbox tests will be skipped."
          fi

      - name: Install package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Native sandbox tests
        if: steps.userns.outputs.available == 'true'
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_bash_tool.py::test_evaluation_sandbox_blocks_python_code_host_read_or_fails_closed \
            tests/test_bash_tool.py::test_real_evaluation_sandbox_runs_python_and_pytest_with_isolation \
            -rs | tee native-sandbox.out

          if grep -Eiq "skipped|SKIPPED" native-sandbox.out; then
            echo "Native Bubblewrap sandbox tests must not skip when user namespaces are available."
            exit 1
          fi

          grep -Eq "2 passed" native-sandbox.out

      - name: Tests and coverage
        run: |
          set -euo pipefail
          pytest -q
          pytest -q \
            --cov=longrun_agent \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Quality gates
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .
          python -m compileall -q src tests scripts
          git diff --check
