model:
  provider: openai_compatible
  model_name: "${MODEL_NAME}"
  base_url: "${OPENAI_BASE_URL}"
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  max_output_tokens: 4096
  request_timeout_seconds: 120
  max_api_retries: 3

agent:
  max_steps: 20
  max_consecutive_errors: 4
  max_session_seconds: 300

workspace:
  root: ../examples/video_demo_repo

tools:
  read_file:
    max_lines: 200
    max_chars: 30000
  write_file:
    max_chars: 50000
    save_diff: true
  bash:
    timeout_seconds: 60
    max_output_chars: 12000
    shell: false

telemetry:
  run_root: ../.runs/video_demo
  save_prompts: true
  save_full_tool_outputs: true

context:
  mode: recent_window
  model_context_limit: 24000
  reserve_output_tokens: 4096
  safety_margin_tokens: 1024
